# ---- Server (Render gives a PORT; locally it is 8080) ----
server.port=${PORT:8080}

# ---- Neon database (values come from environment variables) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=5

# Tables are created by db/schema_v2.sql, so Hibernate must not touch them
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- Email (Gmail SMTP with an App Password) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# ---- App settings ----
# Where the website lives (used to build the link inside the email)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Websites allowed to call this API (comma separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
# Sample industry benchmark used on the Skill Gap page
app.benchmark=${BENCHMARK:75}
